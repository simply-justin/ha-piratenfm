[project]
name = "ha-piratenfm"
version = "0.1.0"
description = "Home Assistant integration that syncs Piraten.FM pirate radio stations into Music Assistant"
license = "MIT"
requires-python = ">=3.13.2"
dependencies = ["music-assistant-client>=1.3.3"]

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.316",
  "ruff==0.17.6",
  "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = ["D203", "D213", "PLR2004", "PLR0913", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "PLR2004", "PLR0917", "PLC0415", "ASYNC110"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.piratenfm"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
files = ["custom_components/piratenfm"]

[[tool.mypy.overrides]]
module = ["voluptuous.*"]
ignore_missing_imports = true
